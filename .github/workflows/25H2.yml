name: 25H2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Workflow mode'
        required: false
        default: 'build'
        type: choice
        options:
          - 'build'
          - 'copy-only'
  schedule:
    - cron: "0 3 * * *"
  
jobs:
  build-and-upload:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show available disk space before build
        run: Get-PSDrive -PSProvider FileSystem

      - name: Install rclone
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath rclone
          $rcloneDir = Get-ChildItem rclone -Directory | Select-Object -First 1
          echo "RCLONE_PATH=$($rcloneDir.FullName)\rclone.exe" >> $env:GITHUB_ENV

      - name: Configure rclone
        shell: pwsh
        env:
          GDRIVE_TEST_TOKEN: ${{ secrets.GDRIVE_TEST_TOKEN }}
          GDRIVE_PROD_TOKEN: ${{ secrets.GDRIVE_PROD_TOKEN }}
        run: |
          $configPath = "$env:USERPROFILE\.config\rclone\rclone.conf"
          New-Item -ItemType Directory -Path (Split-Path $configPath) -Force | Out-Null
          @"
          [gdrive-test]
          type = drive
          token = $env:GDRIVE_TEST_TOKEN

          [gdrive-prod]
          type = drive
          token = $env:GDRIVE_PROD_TOKEN
          "@ | Set-Content $configPath

      - name: Build
        id: build
        shell: pwsh
        run: |
          $mode = "${{ github.event.inputs.mode }}"
          $rcloneRemote = "gdrive-test"
          $rcloneProdRemote = "gdrive-prod"
          if ($mode -eq "copy-only") {
            pwsh uup-dump-get-windows-iso.ps1 25H2 c:/output -rcloneRemote $rcloneRemote -rcloneProdRemote $rcloneProdRemote -copyOnly
          } else {
            pwsh uup-dump-get-windows-iso.ps1 25H2 c:/output -rcloneRemote $rcloneRemote
          }

      - name: Show available disk space after build
        run: Get-PSDrive -PSProvider FileSystem

      - name: Build summary
        if: steps.build.outputs.skipped != 'true' && github.event.inputs.mode != 'copy-only'
        run: |
          $iso = Get-Content (Resolve-Path c:/output/*.json) | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY @"
          | Property | Value |
          | :--- | :--- |
          | Name | $($iso.name) |
          | Build | $($iso.build) |
          | Checksum | $($iso.checksum) |
          | Image Name | $($iso.images[0].name) |
          "@

      - name: Copy-only summary
        if: github.event.inputs.mode == 'copy-only'
        shell: pwsh
        run: |
          $iso = & "$env:RCLONE_PATH" cat "gdrive-prod:25H2/25H2.iso.json" 2>$null
          if ($LASTEXITCODE -eq 0 -and $iso) {
            $isoObj = $iso | ConvertFrom-Json
            Add-Content $env:GITHUB_STEP_SUMMARY @"
            | Property | Value |
            | :--- | :--- |
            | Mode | Copy-only |
            | Name | $($isoObj.name) |
            | Build | $($isoObj.build) |
            | Checksum | $($isoObj.checksum) |
            | Image Name | $($isoObj.images[0].name) |
            | Source | gdrive-test |
            | Destination | gdrive-prod |
            "@
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "Copy-only mode completed. Check production drive for details."
          }